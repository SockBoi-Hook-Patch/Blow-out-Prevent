<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@500;600&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="../audio.js"></script>
<script src="../scenes.js"></script>
<script>
// Composites one video frame: 180x320 pixel-art scene scaled 6x + burned-in caption box + credit.
const S = 6, W = 180, H = 320;
const px = document.createElement('canvas'); px.width = W; px.height = H;
const pctx = px.getContext('2d'); pctx.imageSmoothingEnabled = false;
const out = document.getElementById('out');
const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
const caps = (window.BOPScenes && BOPScenes.captions) || [];
const seg = new Intl.Segmenter('th', { granularity: 'word' });

function wrap(text, maxW) {
  const words = [...seg.segment(text)].map(s => s.segment);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur + w;
    if (o.measureText(test).width > maxW && cur.trim()) { lines.push(cur.trim()); cur = w.trimStart(); }
    else cur = test;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

// ---- 8-bit text layer -------------------------------------------------------
// Text is drawn on a low-res layer (360x640, 1 px = 3 output px) with antialiasing
// thresholded away, then scaled up nearest-neighbour => chunky, readable pixel text.
const L = 3, LW = 360, LH = 640;
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const l = lo.getContext('2d', { willReadFrequently: true });
const tmp = document.createElement('canvas'); tmp.width = LW; tmp.height = 80;
const tc = tmp.getContext('2d', { willReadFrequently: true });
const gseg = new Intl.Segmenter('th', { granularity: 'grapheme' });
const graphemes = s => [...gseg.segment(s)].map(x => x.segment);

// draw `text` as a binarised pixel sprite with a 1px hard drop shadow
function pixelText(text, font, x, y, color, align, shadow = '#000') {
  tc.clearRect(0, 0, LW, 80);
  tc.font = font; tc.textBaseline = 'alphabetic'; tc.textAlign = 'left';
  const w = Math.ceil(tc.measureText(text).width);
  tc.fillStyle = '#fff'; tc.fillText(text, 2, 56);
  const img = tc.getImageData(0, 0, LW, 80), d = img.data;
  const sh = tc.createImageData(LW, 80), sd = sh.data;
  const [r, g, b] = hex(color), [sr, sg, sb] = hex(shadow);
  for (let i = 0; i < d.length; i += 4) {
    const on = d[i + 3] >= 110;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = on ? 255 : 0;
    sd[i] = sr; sd[i + 1] = sg; sd[i + 2] = sb; sd[i + 3] = on ? 255 : 0;
  }
  const x0 = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x) - 2;
  const y0 = Math.round(y) - 56;
  tc.putImageData(sh, 0, 0); l.drawImage(tmp, x0 + 1, y0 + 1);
  tc.putImageData(img, 0, 0); l.drawImage(tmp, x0, y0);
  return w;
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function wrapLo(text, font, maxW) {
  tc.font = font;
  const words = [...seg.segment(text)].map(s => s.segment);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur + w;
    if (tc.measureText(test).width > maxW && cur.trim()) { lines.push(cur.trim()); cur = w.trimStart(); }
    else cur = test;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

// caption box in low-res coords (pixel-art y 245..307 => 490..614)
const BOX = { x: 14, y: 490, w: 332, h: 124 };
const TH_FONT = s => `bold ${s}px Loma, Kanit, sans-serif`;
const EN_FONT = '8px "Press Start 2P", monospace';
let layerKey = '';

function drawTextLayer(t) {
  const c = caps.find(c => t >= c.t0 && t < c.t1);
  const reveal = c ? Math.min(1, (t - c.t0) / 0.6) : 1;
  const blink = Math.floor(t * 2.5) % 2;
  const key = (c ? caps.indexOf(c) : -1) + ':' + Math.round(reveal * 60) + ':' + (reveal >= 1 ? blink : 0);
  if (key === layerKey) return;
  layerKey = key;
  l.clearRect(0, 0, LW, LH);
  if (c) {
    // 8-bit RPG dialog box
    l.fillStyle = '#000'; l.fillRect(BOX.x - 2, BOX.y - 2, BOX.w + 4, BOX.h + 4);
    l.fillStyle = '#f4f4f4'; l.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
    l.fillStyle = '#1d1d3a'; l.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4);
    l.fillStyle = '#000'; [[0,0],[BOX.w-2,0],[0,BOX.h-2],[BOX.w-2,BOX.h-2]].forEach(([a,b]) => l.fillRect(BOX.x+a, BOX.y+b, 2, 2));
    const pad = 12, maxW = BOX.w - pad * 2;
    let size = 22, lines;
    for (;;) {
      lines = wrapLo(c.th, TH_FONT(size), maxW);
      if (lines.length <= 2 || size <= 15) break;
      size -= 1;
    }
    const lh = Math.round(size * 1.55), enH = c.en ? 20 : 0;
    const total = lines.length * lh + enH;
    let y = BOX.y + Math.round((BOX.h - total) / 2) + Math.round(size * 1.05);
    let n = Math.ceil(lines.reduce((a, ln) => a + graphemes(ln).length, 0) * reveal);
    for (const line of lines) {
      const g = graphemes(line);
      tc.font = TH_FONT(size);
      const fullW = tc.measureText(line).width;
      const vis = g.slice(0, Math.max(0, n)).join(''); n -= g.length;
      if (vis) pixelText(vis, TH_FONT(size), BOX.x + (BOX.w - fullW) / 2, y, '#ffffff', 'left');
      y += lh;
    }
    if (c.en) {
      const enLines = wrapLo(c.en.toUpperCase(), EN_FONT, maxW);
      pixelText(enLines[0], EN_FONT, BOX.x + BOX.w / 2, y - lh + 22, '#9a9ac0', 'center');
    }
    if (reveal >= 1 && blink === 0) { // blinking "next" arrow
      l.fillStyle = '#ffcc00';
      const ax = BOX.x + BOX.w - 16, ay = BOX.y + BOX.h - 11;
      l.fillRect(ax, ay, 8, 2); l.fillRect(ax + 2, ay + 2, 4, 2);
    }
  }
  // credit, bottom-right
  pixelText('Sockboi', '8px "Press Start 2P", monospace', LW - 10, LH - 8, '#ffcc00', 'right');
}

window.renderFrame = function (t, type) {
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, W, H);
  BOPScenes.draw(pctx, t);
  o.drawImage(px, 0, 0, W * S, H * S);
  // subtle CRT scanlines
  o.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = S - 2; y < 1920; y += S) o.fillRect(0, y, 1080, 2);
  drawTextLayer(t);
  o.drawImage(lo, 0, 0, LW * L, LH * L);
  return out.toDataURL(type || 'image/png').split(',')[1];
};

window.renderAudio = async function () {
  const bytes = await ChipMusic.renderWav(BOPScenes.cues || []);
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
};

window.ready = document.fonts.load('bold 20px Loma').then(() => document.fonts.load('20px "Press Start 2P"')).then(() => true, () => true);
</script>
</body>
</html>
