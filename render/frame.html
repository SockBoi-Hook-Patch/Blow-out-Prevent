<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>@font-face{font-family:"TA8";src:url("fonts/TA8bit.ttf") format("truetype");font-display:block}
html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="../audio.js"></script>
<script src="../scenes.js"></script>
<script>
// Composites one video frame: 180x320 pixel-art scene scaled 6x + burned-in caption box + credit.
const S = 6, W = 180, H = 320;
const px = document.createElement('canvas'); px.width = W; px.height = H;
const pctx = px.getContext('2d'); pctx.imageSmoothingEnabled = false;
const out = document.getElementById('out');
const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
const caps = (window.BOPScenes && BOPScenes.captions) || [];
const seg = new Intl.Segmenter('th', { granularity: 'word' });

function wrap(text, maxW) {
  const words = [...seg.segment(text)].map(s => s.segment);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur + w;
    if (o.measureText(test).width > maxW && cur.trim()) { lines.push(cur.trim()); cur = w.trimStart(); }
    else cur = test;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

// ---- 8-bit text layer (font: "TA 8 BIT" by TA Font, f0nt.com) ---------------
// Caption box is drawn on a low-res layer (1 px = L video px) and scaled up; text is
// drawn at full resolution, sized so one font cell lines up with the L-px grid.
const L = 4, LW = 1080 / L, LH = 1920 / L;
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const l = lo.getContext('2d');
// Text is drawn straight onto the 1080x1920 output with the TA 8 BIT pixel font,
// sized so one font cell (~69 units) = L video px, so its blocks line up with the box art.
const FS = Math.round(1000 / 69 * L);         // ~58px  (1 cell = 4px)
const FS_EN = Math.round(1000 / 69 * 3);      // ~43px  (1 cell = 3px)
const gseg = new Intl.Segmenter('th', { granularity: 'grapheme' });
const graphemes = s => [...gseg.segment(s)].map(x => x.segment);
let curFont = '';
const setFont = f => { if (curFont !== f) { o.font = f; curFont = f; } };
const fontOf = size => `${size}px TA8`;
let measureSize = FS;
const textW = text => { setFont(fontOf(measureSize)); return o.measureText(text).width / L; };

// pixel text, coordinates in layer units (x L = video px); hard drop shadow of one cell
function pixelText(text, x, y, color, align, size = FS, shadow = '#000') {
  setFont(fontOf(size)); o.textBaseline = 'alphabetic'; o.textAlign = 'left';
  const w = o.measureText(text).width;
  const X = Math.round(align === 'center' ? x * L - w / 2 : align === 'right' ? x * L - w : x * L);
  const Y = Math.round(y * L), d = Math.round(size / 1000 * 69);
  o.fillStyle = shadow; o.fillText(text, X + d, Y + d);
  o.fillStyle = color; o.fillText(text, X, Y);
  return w / L;
}

function wrapLo(text, maxW, size = FS) {
  measureSize = size;
  const words = [...seg.segment(text)].map(s => s.segment);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur + w;
    if (textW(test.trim()) > maxW && cur.trim()) { lines.push(cur.trim()); cur = w.trimStart(); }
    else cur = test;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

// caption box in layer coords (pixel-art y 245..307 => 367..461 at 1.5x)
const BOX = { x: 10, y: 367, w: LW - 20, h: 95 };

function drawTextLayer(t) {
  const c = caps.find(c => t >= c.t0 && t < c.t1);
  const reveal = c ? Math.min(1, (t - c.t0) / 0.6) : 1;
  const blink = Math.floor(t * 2.5) % 2;
  l.clearRect(0, 0, LW, LH);
  if (c) {
    // 8-bit RPG dialog box
    l.fillStyle = '#000'; l.fillRect(BOX.x - 1, BOX.y - 1, BOX.w + 2, BOX.h + 2);
    l.fillStyle = '#f4f4f4'; l.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
    l.fillStyle = '#1d1d3a'; l.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4);
    l.fillStyle = '#000'; [[0,0],[BOX.w-1,0],[0,BOX.h-1],[BOX.w-1,BOX.h-1]].forEach(([a,b]) => l.fillRect(BOX.x+a, BOX.y+b, 1, 1));
    o.drawImage(lo, 0, 0, LW * L, LH * L);
    const pad = 8, maxW = BOX.w - pad * 2;
    let lines = wrapLo(c.th, maxW).slice(0, 3);
    let enLines = c.en ? wrapLo(c.en, maxW, FS_EN) : [];
    const lh = 16, enLh = 12, gap = 2;
    if (lines.length * lh + gap + enLines.length * enLh > BOX.h - 12) enLines = enLines.slice(0, 1);
    if (lines.length * lh + gap + enLines.length * enLh > BOX.h - 12) enLines = [];
    const total = lines.length * lh + (enLines.length ? gap + enLines.length * enLh : 0);
    let y = BOX.y + Math.round((BOX.h - total) / 2) + 10;
    let n = Math.ceil(lines.reduce((a, ln) => a + graphemes(ln).length, 0) * reveal);
    for (const line of lines) {
      const g = graphemes(line);
      measureSize = FS; const fullW = textW(line);
      const vis = g.slice(0, Math.max(0, n)).join(''); n -= g.length;
      if (vis) pixelText(vis, BOX.x + Math.round((BOX.w - fullW) / 2), y, '#ffffff', 'left');
      y += lh;
    }
    y += gap - (lh - enLh);
    for (const el of enLines) { pixelText(el, BOX.x + BOX.w / 2, y, '#8fd0ff', 'center', FS_EN); y += enLh; }
    if (reveal >= 1 && blink === 0) { // blinking "next" arrow
      l.fillStyle = '#ffcc00';
      const ax = BOX.x + BOX.w - 10, ay = BOX.y + BOX.h - 7;
      l.fillRect(ax, ay, 5, 1); l.fillRect(ax + 1, ay + 1, 3, 1); l.fillRect(ax + 2, ay + 2, 1, 1);
    }
  }
  // credit, bottom-right
  pixelText('Sockboi', LW - 6, LH - 5, '#ffcc00', 'right');
}

window.renderFrame = function (t, type) {
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, W, H);
  BOPScenes.draw(pctx, t);
  o.drawImage(px, 0, 0, W * S, H * S);
  // subtle CRT scanlines
  o.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = S - 2; y < 1920; y += S) o.fillRect(0, y, 1080, 2);
  drawTextLayer(t);
  return out.toDataURL(type || 'image/png').split(',')[1];
};

window.renderAudio = async function () {
  const bytes = await ChipMusic.renderWav(BOPScenes.cues || []);
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
};

window.ready = document.fonts.load('58px TA8').then(() => true, () => true);
</script>
</body>
</html>
