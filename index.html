<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOP 8-bit Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b1a;
    --panel: #14142b;
    --ink: #f4f4f4;
    --muted: #8a8aa8;
    --accent: #ffcc00;
    --danger: #ff3b3b;
    --ok: #3bd16f;
    --edge: #2c2c54;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #1a1a33; }
  }
  :root[data-theme="dark"] { --bg: #0b0b1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Kanit", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%;
    padding: 16px;
  }
  .wrap { width: min(100%, 960px); }
  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 4px solid var(--edge);
    box-shadow: 0 0 0 4px #000, 0 12px 40px rgba(0,0,0,.6);
    overflow: hidden;
  }
  canvas {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .scan {
    pointer-events: none; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.55); cursor: pointer; text-align: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .overlay .big {
    font-family: "Press Start 2P", monospace; color: var(--accent);
    font-size: clamp(14px, 3.4vw, 28px); text-shadow: 3px 3px 0 #000;
    animation: blink 1s steps(2, start) infinite;
  }
  .overlay .sub { font-size: clamp(13px, 2.2vw, 18px); color: var(--ink); text-shadow: 2px 2px 0 #000; }
  @keyframes blink { to { visibility: hidden; } }
  .caption {
    margin-top: 10px; min-height: 4.6em;
    background: var(--panel); border: 4px solid var(--edge);
    padding: 10px 14px; display: flex; flex-direction: column; justify-content: center;
  }
  .caption .th { font-size: clamp(15px, 2.4vw, 22px); font-weight: 600; line-height: 1.35; }
  .caption .en { font-family: "Press Start 2P", monospace; font-size: clamp(8px, 1.2vw, 11px); color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    font-family: "Press Start 2P", monospace; font-size: 10px;
    background: var(--panel); color: var(--ink); border: 3px solid var(--edge);
    padding: 8px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .track { flex: 1; min-width: 120px; height: 12px; background: var(--panel); border: 3px solid var(--edge); position: relative; cursor: pointer; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); width: 0; }
  .marks span { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .6; }
  .time { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--muted); min-width: 92px; text-align: right; }
  .chapters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chapters button { font-size: 8px; padding: 6px 8px; }
  .chapters button.on { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="screen">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="scan"></div>
    <div class="overlay" id="start">
      <div class="big">▶ PRESS START</div>
      <div class="sub">แตะเพื่อเริ่ม · ภาพเคลื่อนไหวอธิบาย BOP พร้อมเพลง 8-bit (60 วินาที วนซ้ำ)</div>
    </div>
  </div>
  <div class="caption" aria-live="polite">
    <div class="th" id="capTh">BOP — Blowout Preventer</div>
    <div class="en" id="capEn">8-BIT EXPLAINER</div>
  </div>
  <div class="bar">
    <button id="play" aria-label="Play/Pause">❚❚</button>
    <button id="mute" aria-label="Mute">♪ ON</button>
    <div class="track" id="track"><div class="fill" id="fill"></div><div class="marks" id="marks"></div></div>
    <div class="time" id="time">00.0 / 60</div>
  </div>
  <div class="chapters" id="chapters"></div>
</div>

<script src="audio.js"></script>
<script src="scenes.js"></script>
<script>
(function () {
  const LOOP = 60;
  const CHAPTERS = [
    { t: 0,  name: 'TITLE' },
    { t: 6,  name: 'ANATOMY' },
    { t: 16, name: 'DRILLING' },
    { t: 24, name: 'KICK' },
    { t: 37, name: 'BLOWOUT' },
    { t: 50, name: 'SUMMARY' },
  ];
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const Music = window.ChipMusic || null;
  const Scenes = window.BOPScenes || { draw(c){ c.fillStyle='#000'; c.fillRect(0,0,320,180); }, cues: [], captions: [] };
  const cues = (Scenes.cues || []).slice().sort((a, b) => a.t - b.t);
  const caps = Scenes.captions || [];

  const $ = id => document.getElementById(id);
  const capTh = $('capTh'), capEn = $('capEn'), fill = $('fill'), timeEl = $('time');

  let started = false, playing = false, muted = false;
  let base = 0;            // loop position when clock (re)started
  let baseMs = 0;          // performance.now() at that moment
  let pausedAt = 0;
  let lastT = 0;
  let audioOk = false;

  // chapter buttons + marks
  const chapWrap = $('chapters'), marks = $('marks');
  const chapBtns = CHAPTERS.map(c => {
    const b = document.createElement('button');
    b.textContent = c.name;
    b.addEventListener('click', () => seek(c.t));
    chapWrap.appendChild(b);
    const m = document.createElement('span');
    m.style.left = (c.t / LOOP * 100) + '%';
    marks.appendChild(m);
    return b;
  });

  function clockT() {
    if (!playing) return pausedAt;
    if (audioOk && !muted) {
      const n = Music.now();
      if (typeof n === 'number' && isFinite(n)) return ((n % LOOP) + LOOP) % LOOP;
    }
    return (base + (performance.now() - baseMs) / 1000) % LOOP;
  }

  function fireCues(prev, cur) {
    if (!audioOk || muted || !playing) return;
    const hit = c => { try { Music.sfx(c.sfx); } catch (e) {} };
    if (cur >= prev) {
      if (cur - prev > 0.5) return; // a seek, not playback
      for (const c of cues) if (c.t > prev && c.t <= cur) hit(c);
    } else if (prev - cur > LOOP - 0.5) { // wrapped
      for (const c of cues) if (c.t > prev || c.t <= cur) hit(c);
    }
  }

  let capIdx = -1;
  function updateCaption(t) {
    let i = caps.findIndex(c => t >= c.t0 && t < c.t1);
    if (i === capIdx) return;
    capIdx = i;
    if (i >= 0) { capTh.textContent = caps[i].th; capEn.textContent = caps[i].en || ''; }
  }

  function updateUI(t) {
    fill.style.width = (t / LOOP * 100) + '%';
    timeEl.textContent = t.toFixed(1).padStart(4, '0') + ' / 60';
    let ci = 0;
    CHAPTERS.forEach((c, i) => { if (t >= c.t) ci = i; });
    chapBtns.forEach((b, i) => b.classList.toggle('on', i === ci));
  }

  function frame() {
    const t = clockT();
    fireCues(lastT, t);
    lastT = t;
    try { Scenes.draw(ctx, t); } catch (e) { console.error(e); }
    updateCaption(t);
    updateUI(t);
    requestAnimationFrame(frame);
  }

  function startClock(t0) {
    base = t0; baseMs = performance.now(); lastT = t0;
    if (audioOk && !muted) { try { Music.stop(); Music.start(t0); } catch (e) {} }
  }

  function play() {
    playing = true;
    startClock(pausedAt);
    $('play').textContent = '❚❚';
  }
  function pause() {
    pausedAt = clockT();
    playing = false;
    if (audioOk) { try { Music.stop(); } catch (e) {} }
    $('play').textContent = '▶';
  }
  function seek(t) {
    t = Math.max(0, Math.min(LOOP - 0.01, t));
    pausedAt = t; lastT = t;
    if (playing) startClock(t);
  }

  $('start').addEventListener('click', () => {
    $('start').hidden = true;
    started = true;
    if (Music) { try { Music.init(); audioOk = true; } catch (e) { audioOk = false; } }
    pausedAt = 0;
    play();
  });
  $('play').addEventListener('click', () => { if (!started) return $('start').click(); playing ? pause() : play(); });
  $('mute').addEventListener('click', () => {
    if (!started) return;
    const t = clockT();
    muted = !muted;
    $('mute').textContent = muted ? '♪ OFF' : '♪ ON';
    if (!audioOk) return;
    // keep the visual clock continuous across mute toggles
    if (muted) { base = t; baseMs = performance.now(); try { Music.stop(); } catch (e) {} }
    else if (playing) { startClock(t); }
  });
  $('track').addEventListener('click', e => {
    if (!started) return;
    const r = e.currentTarget.getBoundingClientRect();
    seek((e.clientX - r.left) / r.width * LOOP);
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  });

  pausedAt = 0;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
