    <path d="M632 222 C660 270 672 330 672 395" fill="none" stroke="#c3ced8" stroke-width="6"/>
    <!-- ridge -->
    <path d="M524 178 Q540 172 556 178 L566 398 L514 398 Z" fill="#e4eaef"/>
    <path d="M531 182 L527 396" stroke="#ffffff" stroke-width="6" fill="none"/>
    <!-- brim -->
    <path d="M318 396 C400 374 680 374 762 396 C774 408 770 424 752 428 C690 444 600 462 540 462 C480 462 390 444 328 428 C310 424 306 408 318 396 Z" fill="url(#brim)"/>
    <!-- highlight -->
