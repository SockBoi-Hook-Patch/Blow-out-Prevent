    <ellipse cx="698" cy="500" rx="30" ry="42" fill="#e6a777"/>
    <!-- head -->
    <path d="M384 420 C380 560 440 652 540 656 C640 652 700 560 696 420 C696 340 640 300 540 300 C440 300 384 340 384 420 Z" fill="url(#skin)"/>
  </g>

  <!-- face details -->
