    <circle cx="628" cy="318" r="34" fill="#0f6f7a" stroke-width="5"/>
    <path d="M628 294 C640 312 648 322 648 332 A20 20 0 0 1 608 332 C608 322 616 312 628 294 Z" fill="#ff8a1f" stroke="none"/>
