    <path d="M530 555 Q540 564 550 555" fill="none" stroke="#b87a4c" stroke-width="6"/>
    <!-- mouth -->
    <path d="M488 584 Q540 594 592 584 Q588 640 540 642 Q492 640 488 584 Z" fill="#7a1f2b" stroke="#1b2433" stroke-width="6"/>
    <path d="M495 588 Q540 597 585 588 L583 602 Q540 610 497 602 Z" fill="#fff"/>
    <path d="M510 628 Q540 610 570 628 Q556 640 540 640 Q524 640 510 628 Z" fill="#e8636a"/>
