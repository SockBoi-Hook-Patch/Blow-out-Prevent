      <line x1="100" y1="960" x2="257" y2="960"/><line x1="100" y1="1000" x2="254" y2="1000"/>
      <line x1="823" y1="960" x2="980" y2="960"/><line x1="826" y1="1000" x2="980" y2="1000"/>
