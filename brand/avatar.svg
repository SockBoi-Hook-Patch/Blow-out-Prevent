    <ellipse cx="632" cy="568" rx="34" ry="20" fill="#f08a7a" opacity="0.45"/>
    <!-- brows -->
    <path d="M448 468 Q478 452 506 466" fill="none" stroke="#2a1d1a" stroke-width="11"/>
    <path d="M574 466 Q602 452 632 468" fill="none" stroke="#2a1d1a" stroke-width="11"/>
    <!-- eyes -->
    <ellipse cx="478" cy="510" rx="21" ry="28" fill="#1b2433"/>
    <ellipse cx="602" cy="510" rx="21" ry="28" fill="#1b2433"/>
    <circle cx="485" cy="500" r="7" fill="#fff"/>
    <circle cx="609" cy="500" r="7" fill="#fff"/>
    <circle cx="472" cy="520" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="596" cy="520" r="3" fill="#fff" opacity="0.8"/>
