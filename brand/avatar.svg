    <path d="M360 912 H494 V944 H360 Z" fill="#e3670f" stroke-width="5"/>
    <rect x="385" y="958" width="84" height="30" rx="7" fill="#ffffff" stroke-width="4"/>
    <circle cx="400" cy="973" r="7" fill="#11808a" stroke="none"/>
    <line x1="414" y1="973" x2="456" y2="973" stroke="#9aa6b0" stroke-width="5"/>
