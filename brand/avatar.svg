    <g clip-path="url(#sleeveClip)" stroke="none"><rect x="660" y="1010" width="170" height="40" fill="url(#stripe)"/></g>
    <path d="M684 1012 L790 1006 M682 1052 L796 1046" fill="none" stroke-width="5"/>
    <path d="M690 944 L776 930 C784 990 798 1050 812 1110 L676 1110 C680 1050 686 990 690 944 Z" fill="none"/>
    <path d="M684 932 Q730 946 778 924 L782 950 Q732 972 690 958 Z" fill="#d9590a" stroke-width="5"/>
    <!-- hand -->
    <path d="M676 830 C672 800 684 778 700 780 C716 782 716 806 712 836 L760 836 C780 836 784 856 772 866 C788 872 786 894 770 898 C784 906 780 926 764 928 L708 932 C686 932 668 916 668 890 L668 852 C668 842 672 834 676 830 Z" fill="url(#skin)"/>
    <path d="M714 866 H772 M716 898 H770" fill="none" stroke-width="5"/>
    <path d="M700 836 Q706 850 714 852" fill="none" stroke-width="5"/>
    </g>
    <!-- ears -->
