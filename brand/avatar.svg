<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="540" cy="440" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16808a"/>
      <stop offset="0.45" stop-color="#0d4f68"/>
      <stop offset="1" stop-color="#071a33"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#c9d3dc"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f9"/>
      <stop offset="1" stop-color="#bfcad4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c193"/>
      <stop offset="1" stop-color="#e2a676"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8650f"/>
      <stop offset="0.35" stop-color="#ff8a1f"/>
      <stop offset="0.65" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#d9590a"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6"/>
      <stop offset="0.5" stop-color="#b8c4cc"/>
      <stop offset="1" stop-color="#dfe6ea"/>
    </linearGradient>
    <clipPath id="torsoClip">
      <path d="M120 1100 C128 900 178 792 318 748 L468 694 L612 694 L762 748 C902 792 952 900 960 1100 Z"/>
    </clipPath>
    <linearGradient id="brimShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c5228" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9c5228" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa646"/>
      <stop offset="1" stop-color="#f27a1a"/>
    </linearGradient>
    <clipPath id="headClip"><path d="M384 420 C380 560 440 652 540 656 C640 652 700 560 696 420 C696 340 640 300 540 300 C440 300 384 340 384 420 Z"/></clipPath>
  </defs>

  <!-- background -->
