    <polygon points="300,0 620,0 420,140" opacity="0.025"/>
    <polygon points="620,0 1080,0 900,220" opacity="0.04"/>
    <polygon points="1080,0 1080,380 900,220" opacity="0.02"/>
    <polygon points="0,260 120,260 0,560" opacity="0.025"/>
    <polygon points="900,220 1080,380 980,560" opacity="0.035"/>
