<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- namman.story avatar — minimal cute side profile (facing right) -->
  <rect width="1080" height="1080" fill="#0f4c5c"/>
  <circle cx="540" cy="540" r="430" fill="#13606f"/>

  <!-- body (side view): torso + front chest -->
  <path d="M250 1080 C250 900 330 790 500 780 C640 772 760 830 800 960 L820 1080 Z" fill="#f7882f"/>
  <!-- collar (front, right side) -->
  <path d="M560 784 C620 790 668 812 700 846 L640 870 C618 838 592 818 560 806 Z" fill="#e06d17"/>
  <!-- arm / sleeve -->
  <path d="M380 860 C430 840 500 850 520 900 L540 1080 L380 1080 Z" fill="#ee7a22"/>
  <!-- reflective stripes -->
  <path d="M388 962 L528 962 L533 1004 L388 1004 Z" fill="#e9eef2"/>
  <path d="M560 962 L806 962 L812 1004 L564 1004 Z" fill="#e9eef2"/>

  <!-- neck -->
  <path d="M470 700 L580 700 L572 800 L478 800 Z" fill="#d99a6c"/>

  <!-- head -->
  <circle cx="520" cy="560" r="180" fill="#f0b48a"/>
  <!-- nose -->
  <circle cx="696" cy="600" r="26" fill="#f0b48a"/>
  <!-- hair at the back -->
  <path d="M346 500 C344 560 368 618 412 650 C396 600 398 540 414 500 Z" fill="#2a2f3a"/>
  <!-- ear -->
  <circle cx="452" cy="584" r="34" fill="#e8a578"/>
  <circle cx="452" cy="584" r="14" fill="#d99a6c"/>

  <!-- face -->
  <ellipse cx="626" cy="572" rx="17" ry="22" fill="#1d2b36"/>
  <circle cx="632" cy="564" r="6" fill="#ffffff"/>
  <circle cx="606" cy="628" r="26" fill="#ef8f7a" opacity="0.6"/>
  <path d="M642 642 Q668 668 690 650" stroke="#1d2b36" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- hard hat (side view) -->
  <path d="M326 490 C326 352 416 292 520 292 C626 292 700 360 704 490 Z" fill="#ffffff"/>
  <!-- brim: long at front (right), short at back (left) -->
  <path d="M312 482 L700 482 C770 482 830 488 846 504 C850 512 844 516 834 516 L326 516 C310 516 304 494 312 482 Z" fill="#ffffff"/>
  <path d="M322 504 L846 504 C846 512 842 516 834 516 L326 516 Z" fill="#d8e0e6"/>
  <!-- ridge -->
  <path d="M352 440 C360 350 430 306 520 304 C600 304 660 344 686 420" stroke="#e7edf1" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- oil-drop badge on the side -->
  <circle cx="508" cy="418" r="40" fill="#0f4c5c"/>
  <path d="M508 388 C521 407 531 421 531 434 A23 23 0 0 1 485 434 C485 421 495 407 508 388 Z" fill="#f7882f"/>
</svg>
